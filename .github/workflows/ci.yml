# @heypcb/mcp: tests on every pull request and push, and the npm release.
#
# - test: the package's own lockfile (pnpm --ignore-workspace), the
#   typecheck, the node --test suite against a fake HeyPCB host (the official
#   MCP SDK's own server, the device-code and token endpoints, the two REST
#   routes), the one-file bundle, the built file run over stdio, and what
#   `npm publish` would upload — on Node 18 (the package's engines floor)
#   and Node 22.
# - publish: on a push to main, after `test` passes, `npm publish --access
#   public --provenance` — only when package.json's version is not on npm
#   yet (scripts/release-check.mjs: the same version publishes nothing, an
#   older one fails). This repository is the package's ONLY publisher, and
#   provenance is why: npm signs a statement linking each version to the
#   public commit and workflow run that built it.
#
# Releases arrive here mirrored from HeyPCB's own repository (see
# CONTRIBUTING.md), so a push to main is a release when its version is new.
# Needs the repository secret NPM_TOKEN, an npm token allowed to publish to
# @heypcb; without it a release fails and says so, never a silent skip.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install (own lockfile)
        run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      - name: The built file, over stdio
        run: pnpm run test:smoke
      - name: What npm would upload
        run: node scripts/check-pack.mjs

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm provenance
    # One release at a time, never cancelled halfway.
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Install (own lockfile)
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Is this version new on npm?
        id: release
        run: node scripts/release-check.mjs
      - name: Build and check what would be uploaded
        if: steps.release.outputs.publish == 'yes'
        run: |
          pnpm run build
          pnpm run test:smoke
          node scripts/check-pack.mjs
      - name: Publish to npm, with provenance
        if: steps.release.outputs.publish == 'yes'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::@heypcb/mcp@${{ steps.release.outputs.version }} is ready but the NPM_TOKEN secret is not set, so it was NOT published."
            exit 1
          fi
          npm publish --access public --provenance --ignore-scripts
